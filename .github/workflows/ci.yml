name: CI

on:
  push:
    branches:
      - main
      - project/analytics-semantic-layer-publisher
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Run demo and smoke checks
        run: |
          python scripts\run_demo.py
          python scripts\smoke_check.py

# Least-privilege: read-only test/CI runs. GITHUB_TOKEN gets no write to
# anything. The publish/release flows (where they exist) carry their own
# scoped permissions per-workflow.
permissions:
  contents: read
